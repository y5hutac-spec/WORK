
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y5HUT ATTANTANCE</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;color:#172554}
header{background:#123c78;color:white;text-align:center;padding:25px}
.container{max-width:800px;margin:25px auto;padding:15px}
.box{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
input,select,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#1763bd;color:white;border:0;font-weight:bold;cursor:pointer}
button:active{background:#0c4388}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
th{background:#eaf2ff}
.scroll{overflow-x:auto}
.delete{background:#dc2626}
.stats{display:flex;gap:10px}
.stats div{flex:1;background:white;padding:15px;text-align:center;border-radius:10px}
@media(max-width:500px){.stats{flex-direction:column}}
</style>
</head>
<body>

<header>
<h1>Y5HUT ATTANTANCE</h1>
<p>Attendance Management System</p>
</header>

<div class="container">

<div class="stats">
<div>Total Records<h2 id="total">0</h2></div>
<div>Present<h2 id="present">0</h2></div>
<div>Absent<h2 id="absent">0</h2></div>
</div>

<div class="box">
<h2>Mark Attendance</h2>

<label>Student / Employee Name</label>
<input id="person" type="text" placeholder="Enter Name">

<label>Date</label>
<input id="date" type="date">

<label>Status</label>
<select id="status">
<option value="Present">Present</option>
<option value="Absent">Absent</option>
<option value="Late">Late</option>
</select>

<button type="button" onclick="saveAttendance()">
SAVE ATTENDANCE
</button>

<p id="message"></p>
</div>

<div class="box">
<h2>Attendance Records</h2>
<button onclick="downloadCSV()">DOWNLOAD CSV</button>
<div class="scroll">
<table>
<thead>
<tr>
<th>Name</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>
</div>
</div>

<script>
let attendance = [];

try {
 attendance = JSON.parse(
 localStorage.getItem("y5hutRecords") || "[]"
 );
 if (!Array.isArray(attendance)) attendance = [];
} catch(error) {
 attendance = [];
}

function localDate(){
 const d = new Date();
 const offset = d.getTimezoneOffset();
 return new Date(d.getTime()-offset*60000)
 .toISOString().slice(0,10);
}

document.getElementById("date").value = localDate();

function saveAttendance(){

 const name = document.getElementById("person").value.trim();
 const date = document.getElementById("date").value;
 const status = document.getElementById("status").value;
 const message = document.getElementById("message");

 if(!name){
  alert("Please enter Name!");
  return;
 }

 if(!date){
  alert("Please select Date!");
  return;
 }

 const exists = attendance.some(
 x => x.name.toLowerCase() === name.toLowerCase()
 && x.date === date
 );

 if(exists){
  alert("Attendance already exists!");
  return;
 }

 const record = {name:name,date:date,status:status};

 attendance.push(record);

 try{
  localStorage.setItem(
   "y5hutRecords",
   JSON.stringify(attendance)
  );
 }catch(error){
  attendance.pop();
  alert("Unable to save. Browser storage may be unavailable.");
  return;
 }

 message.textContent = "Attendance Saved Successfully!";
 message.style.color = "green";

 document.getElementById("person").value = "";
 document.getElementById("date").value = localDate();

 renderRecords();
}

function renderRecords(){

 const table = document.getElementById("records");
 table.innerHTML = "";

 attendance.forEach((item,index)=>{

  const row = document.createElement("tr");

  [item.name,item.date,item.status].forEach(value=>{
   const cell = document.createElement("td");
   cell.textContent = value;
   row.appendChild(cell);
  });

  const action = document.createElement("td");
  const button = document.createElement("button");

  button.textContent = "Delete";
  button.className = "delete";

  button.onclick = function(){
   if(confirm("Delete this record?")){
    attendance.splice(index,1);
    localStorage.setItem(
     "y5hutRecords",JSON.stringify(attendance)
    );
    renderRecords();
   }
  };

  action.appendChild(button);
  row.appendChild(action);
  table.appendChild(row);
 });

 document.getElementById("total").textContent=attendance.length;
 document.getElementById("present").textContent=
 attendance.filter(x=>x.status==="Present").length;
 document.getElementById("absent").textContent=
 attendance.filter(x=>x.status==="Absent").length;
}

function downloadCSV(){

 let csv = "Name,Date,Status\n";

 attendance.forEach(x=>{
  csv += [x.name,x.date,x.status]
   .map(v=>'"'+String(v).replace(/"/g,'""')+'"')
   .join(",")+"\n";
 });

 const blob = new Blob(["\uFEFF"+csv],{
  type:"text/csv;charset=utf-8;"
 });

 const url = URL.createObjectURL(blob);
 const a = document.createElement("a");
 a.href=url;
 a.download="Y5HUT_ATTENDANCE.csv";
 a.click();
 URL.revokeObjectURL(url);
}

renderRecords();
</script>
</body>
</html>
