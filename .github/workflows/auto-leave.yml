
name: Y5HUT Automatic Leave

on:
  schedule:
    - cron: "30 12 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  mark-leave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Mark Employees as Leave
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");

          const serviceAccount = JSON.parse(
            process.env.FIREBASE_SERVICE_ACCOUNT
          );

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const db = admin.firestore();

          async function run() {

            const parts = new Intl.DateTimeFormat("en-GB", {
              timeZone: "Asia/Colombo",
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).formatToParts(new Date());

            const get = type =>
              parts.find(p => p.type === type).value;

            const today =
              `${get("year")}-${get("month")}-${get("day")}`;

            console.log("Checking date:", today);
            console.log("Event:", process.env.GITHUB_EVENT_NAME);

            const employees = await db
              .collection("employees")
              .get();

            const records = await db
              .collection("attendance")
              .where("date", "==", today)
              .get();

            const marked = new Set();

            records.forEach(doc => {
              const d = doc.data();

              if (d.employeeId) {
                marked.add(String(d.employeeId));
              }

              if (d.employeeDocId) {
                marked.add(String(d.employeeDocId));
              }
            });

            let leaveCount = 0;
            let skipCount = 0;
            let dryRunCount = 0;

            for (const employee of employees.docs) {

              const data = employee.data();

              const employeeId =
                String(data.employeeId || employee.id);

              if (
                marked.has(employeeId) ||
                marked.has(employee.id)
              ) {
                console.log("Already recorded:", employeeId);
                skipCount++;
                continue;
              }

              // Manual Run: Dry Run only
              if (
                process.env.GITHUB_EVENT_NAME !== "schedule"
              ) {
                console.log(
                  "[DRY RUN] Would mark LEAVE:",
                  employeeId
                );

                dryRunCount++;
                continue;
              }

              const attendanceId =
                `${today}_${encodeURIComponent(employeeId)}`;

              const attendanceRef = db
                .collection("attendance")
                .doc(attendanceId);

              const created = await db.runTransaction(
                async transaction => {

                  const existing =
                    await transaction.get(attendanceRef);

                  if (existing.exists) {
                    return false;
                  }

                  transaction.set(attendanceRef, {
                    employeeId: employeeId,
                    employeeDocId: employee.id,
                    name: data.name || "",
                    date: today,
                    time: "11:59 PM",
                    status: "LEAVE",
                    reason: "No attendance recorded",
                    method: "Automatic",
                    createdAt:
                      admin.firestore.FieldValue.serverTimestamp()
                  });

                  return true;
                }
              );

              if (created) {
                marked.add(employeeId);
                marked.add(employee.id);
                leaveCount++;

                console.log("LEAVE marked:", employeeId);
              } else {
                skipCount++;
                console.log("Duplicate prevented:", employeeId);
              }
            }

            console.log("--------------------------------");
            console.log("Total Employees:", employees.size);
            console.log("Automatic Leave:", leaveCount);
            console.log("Already Recorded:", skipCount);
            console.log("Dry Run Count:", dryRunCount);
            console.log("Completed:", today);
            console.log("--------------------------------");
          }

          run()
            .then(() => {
              console.log("Workflow completed successfully.");
              process.exit(0);
            })
            .catch(error => {
              console.error("Workflow Error:", error);
              process.exit(1);
            });
          NODE
